version: '3.8'

services:
  db:
    image: mariadb:11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_db_password
      MYSQL_DATABASE: wordpress_dev
      MYSQL_USER: wp_dev_user
      MYSQL_PASSWORD: wp_dev_password
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    depends_on:
      - db
    image: wordpress:7.0.0-php8.3-apache
    ports:
      - "8080:80"
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp_dev_user
      WORDPRESS_DB_PASSWORD: wp_dev_password
      WORDPRESS_DB_NAME: wordpress_dev
    volumes:
      # Mount themes and plugins so only Composer-managed content is available
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wp-content/themes/twentytwentyfive:/var/www/html/wp-content/themes/twentytwentyfive
      - ./wp-content/themes/twenty-twenty-five-child:/var/www/html/wp-content/themes/twenty-twenty-five-child
      - ./vendor:/var/www/html/vendor

volumes:
  db_data:
